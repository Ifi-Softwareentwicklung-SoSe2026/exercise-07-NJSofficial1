name: CI Pipeline

# This workflow is intentionally incomplete. Read it, change it, and extend it.
# Hinzufügen der cd, um vom Projekt-root ins csharp-Verzeichnis zu wechseln

on: 
  push:
    branches: ['**']

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v5

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore dependencies
        run: cd csharp && dotnet restore

      - name: Verify formatting and code style
        run: cd csharp && dotnet format --verify-no-changes --verbosity diagnostic

      - name: Install Doxygen
        run: sudo apt-get install doxygen

      - name: Generate Doxygen file
        run: doxygen

      - name: Upload RTF artifact
        uses: actions/upload-artifact@v5
        with:
          name: doxygen-rtf-documentation
          path: docs/rtf/retman.rtf
